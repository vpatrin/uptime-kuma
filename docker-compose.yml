services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"  # Localhost only - optional for local testing
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - internal

volumes:
  uptime-kuma-data:

networks:
  internal:
    external: true
